<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal AI System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }
        header { background: #1a3c5e; color: white; padding: 20px 40px; }
        header h1 { font-size: 1.5rem; }
        header p { font-size: 0.9rem; opacity: 0.8; margin-top: 4px; }
        .tabs { display: flex; background: #fff; border-bottom: 2px solid #e0e0e0; padding: 0 40px; }
        .tab { padding: 14px 24px; cursor: pointer; font-weight: 500; color: #666; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #1a3c5e; border-bottom-color: #1a3c5e; }
        .content { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .panel { display: none; }
        .panel.active { display: block; }
        .card { background: white; border-radius: 8px; padding: 28px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        label { display: block; font-weight: 500; margin-bottom: 8px; color: #444; }
        textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; resize: vertical; font-family: inherit; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        button { margin-top: 16px; background: #1a3c5e; color: white; border: none; padding: 12px 28px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; }
        button:hover { background: #14304d; }
        button:disabled { background: #999; cursor: not-allowed; }
        .result { margin-top: 24px; padding: 20px; background: #f8f9fa; border-radius: 6px; border-left: 4px solid #1a3c5e; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.6; display: none; }
        .error { border-left-color: #e74c3c; background: #fdf0f0; }
        .spinner { display: none; margin-top: 16px; color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <h1>⚖️ Legal AI System</h1>
    <p>Pakistani Supreme Court Case Research, Petition Drafting & Document Summarization</p>
</header>

<div class="tabs">
    <div class="tab active" onclick="switchTab('rag')">Case Research</div>
    <div class="tab" onclick="switchTab('draft')">Draft Petition</div>
    <div class="tab" onclick="switchTab('summarize')">Summarize Document</div>
</div>

<div class="content">

    <!-- RAG Panel -->
    <div id="rag" class="panel active">
        <div class="card">
            <label>Search cases or ask a legal question</label>
            <textarea id="rag-query" rows="4" placeholder="e.g. Find cases by Justice Yahya Afridi&#10;What was the Supreme Court's ruling in C.A.875_2017?&#10;Section 302 PPC murder cases from 2023"></textarea>
            <button onclick="submitRAG()">Search</button>
            <div class="spinner" id="rag-spinner">⏳ Searching...</div>
            <div class="result" id="rag-result"></div>
        </div>
    </div>

    <!-- Drafter Panel -->
    <div id="draft" class="panel">
        <div class="card">
            <label>Describe your legal situation</label>
            <textarea id="draft-story" rows="6" placeholder="e.g. My brother Ali Khan was arrested without warrant from our home in Gulshan-e-Iqbal by plain clothes officers on March 24 2026. My name is Rafsha Rahim. He is at Gulshan Police Station."></textarea>
            <button onclick="submitDraft()">Generate Petition</button>
            <div class="spinner" id="draft-spinner">⏳ Drafting petition...</div>
            <div class="result" id="draft-result"></div>
        </div>
    </div>

    <!-- Summarizer Panel -->
    <div id="summarize" class="panel">
        <div class="card">
            <label>Upload a legal document (PDF, DOCX, TXT)</label>
            <input type="file" id="summarize-file" accept=".pdf,.docx,.txt,.png,.jpg">
            <button onclick="submitSummarize()">Summarize</button>
            <div class="spinner" id="summarize-spinner">⏳ Analyzing document...</div>
            <div class="result" id="summarize-result"></div>
        </div>
    </div>

</div>

<script>
    function switchTab(name) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(name).classList.add('active');
    }

    function showSpinner(id) {
        document.getElementById(id + '-spinner').style.display = 'block';
        document.getElementById(id + '-result').style.display = 'none';
    }

    function showResult(id, text, isError=false) {
        document.getElementById(id + '-spinner').style.display = 'none';
        const el = document.getElementById(id + '-result');
        el.textContent = text;
        el.className = 'result' + (isError ? ' error' : '');
        el.style.display = 'block';
    }

    async function submitRAG() {
        const query = document.getElementById('rag-query').value.trim();
        if (!query) return;
        showSpinner('rag');
        try {
            const form = new FormData();
            form.append('query', query);
            const res = await fetch('/rag', { method: 'POST', body: form });
            const data = await res.json();
            showResult('rag', data.result, data.status === 'error');
        } catch(e) {
            showResult('rag', 'Request failed: ' + e, true);
        }
    }

    async function submitDraft() {
        const story = document.getElementById('draft-story').value.trim();
        if (!story) return;
        showSpinner('draft');
        try {
            const form = new FormData();
            form.append('story', story);
            const res = await fetch('/draft', { method: 'POST', body: form });
            const data = await res.json();
            showResult('draft', data.result, data.status === 'error');
        } catch(e) {
            showResult('draft', 'Request failed: ' + e, true);
        }
    }

    async function submitSummarize() {
        const file = document.getElementById('summarize-file').files[0];
        if (!file) return;
        showSpinner('summarize');
        try {
            const form = new FormData();
            form.append('file', file);
            const res = await fetch('/summarize', { method: 'POST', body: form });
            const data = await res.json();
            showResult('summarize', data.result, data.status === 'error');
        } catch(e) {
            showResult('summarize', 'Request failed: ' + e, true);
        }
    }
</script>

</body>
</html>
