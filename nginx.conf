# Define rate limit zones — stored in shared memory
# $binary_remote_addr = client IP (binary form, saves memory)

# General API: 10 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Auth endpoints: much stricter — 5 requests/minute per IP (brute force protection)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Heavy endpoints (summarize, draft): 2 requests/minute per IP
limit_req_zone $binary_remote_addr zone=heavy_limit:10m rate=2r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/js text/xml text/javascript application/javascript application/json;
    gzip_min_length 256;

    # ── AUTH — strict rate limit (5 req/min, no burst) ──────────────────────
    location /auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 50M;
    }

    # ── DRAFT & SUMMARIZE — heavy, expensive endpoints ───────────────────────
    location ~ ^/(draft|summarize) {
        limit_req zone=heavy_limit burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 50M;
    }

    # ── RAG & SESSIONS — general API limit ───────────────────────────────────
    location ~ ^/(rag|sessions|health) {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 50M;
    }

    # ── REACT SPA FALLBACK ───────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── STATIC ASSETS ────────────────────────────────────────────────────────
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── CUSTOM 429 ERROR PAGE ────────────────────────────────────────────────
    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"status":"error","message":"Too many requests. Please slow down."}';
    }
}
